# Serves the static web app and proxies /api to PHP-FPM. Terminate TLS in front of this (load balancer / certbot).
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /var/www/web;
    index index.html;
    client_max_body_size 12m;

    # ---- security headers (the API adds its own as well) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    # No inline script or style anywhere in the web app, so the policy can stay strict.
    # Map tiles come from OpenStreetMap; change img-src if you configure another tile server in web/config.js.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data: https://tile.openstreetmap.org; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Enable once the site is served over HTTPS only:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- API ----
    # Docker's embedded DNS; resolving per request means a rebuilt/restarted app container is found again without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        include fastcgi_params;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 60s;
    }

    # ---- static assets: hashed by deploy, cache for a day ----
    location /assets/ {
        expires 1d;
        add_header Cache-Control "public";
        # add_header does not inherit once a location defines its own, so repeat the essentials.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /config.js { add_header Cache-Control "no-store"; add_header X-Content-Type-Options "nosniff" always; }
    location = /index.html { add_header Cache-Control "no-cache"; add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data: https://tile.openstreetmap.org; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always; add_header X-Frame-Options "DENY" always; add_header X-Content-Type-Options "nosniff" always; add_header Referrer-Policy "no-referrer" always; }

    location / { try_files $uri $uri/ /index.html; }

    # never serve dotfiles or source control
    location ~ /\.(?!well-known) { deny all; }
}
