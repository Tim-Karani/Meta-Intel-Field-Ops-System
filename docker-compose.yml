# Local / staging stack:  docker compose up -d --build
# First run:              docker compose exec app php artisan key:generate --force && docker compose exec app php artisan migrate --seed
# Open:                   http://localhost:8080
name: field-ops

x-app: &app
  build: { context: ., dockerfile: docker/php/Dockerfile, target: app }
  env_file: ./backend/.env
  environment:
    DB_HOST: db
    DB_PORT: 5432
  depends_on:
    db: { condition: service_healthy }
  restart: unless-stopped
  volumes:
    - evidence:/var/www/backend/storage/app/private
    - logs:/var/www/backend/storage/logs

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-field_ops}
      POSTGRES_USER: ${DB_USERNAME:-field_ops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in your shell or a .env file next to docker-compose.yml}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # The database is intentionally NOT published to the host.

  app:
    <<: *app

  queue:
    <<: *app
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    healthcheck: { disable: true }

  scheduler:
    <<: *app
    command: sh -c 'while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done'

  web:
    image: nginx:1.27-alpine
    depends_on: [app]
    ports: ["8080:80"]
    volumes:
      - ./web:/var/www/web:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  pgdata:
  evidence:
  logs:
